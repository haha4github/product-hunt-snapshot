name: Product Hunt Data Collection and Visualization

on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch:  # Manual trigger

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # summary.json accumulates history across runs; the data-archive branch is
      # its persistent store (each run restores it, appends one point, re-archives).
      - name: Restore summary history from data-archive
        run: |
          mkdir -p output
          if git fetch origin data-archive --depth=1 2>/dev/null; then
            git show origin/data-archive:summary.json > output/summary.json \
              && echo "Restored $(grep -c '"timestamp"' output/summary.json) data points" \
              || { rm -f output/summary.json; echo "No summary.json on data-archive; starting fresh"; }
          else
            echo "No data-archive branch yet; starting fresh"
          fi

      - name: Fetch Product Hunt posts
        env:
          PH_TOKEN: ${{ secrets.PRODUCT_HUNT_TOKEN }}
        run: node scripts/fetch_producthunt.js

      - name: Build website
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_branch: gh-pages
          publish_dir: ./docs
          github_token: ${{ secrets.GITHUB_TOKEN }}
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Archive raw data
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_branch: data-archive
          publish_dir: ./output
          github_token: ${{ secrets.GITHUB_TOKEN }}
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
