name: Product Hunt Data Collection and Visualization

on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch:  # Manual trigger

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Full history

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Fetch Product Hunt posts
        env:
          PH_TOKEN: ${{ secrets.PRODUCT_HUNT_TOKEN }}
        run: node scripts/fetch_producthunt.js
      
      - name: Cleanup old timestamp format files
        run: |
          # Remove any files that might have been created with logs instead of JSON
          find output -name "posts-*.json" -type f | grep -v "T" | xargs rm -f || true

      - name: Display directory contents for debugging
        run: |
          echo "Output directory contents:"
          ls -la output/
          echo "Checking latest.json:"
          if [ -f output/latest.json ]; then
            head -n 10 output/latest.json
          else
            echo "latest.json not found"
          fi

      - name: Build website
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_branch: gh-pages
          publish_dir: ./docs
          github_token: ${{ secrets.GITHUB_TOKEN }}
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          keep_files: true

      - name: Archive raw data
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_branch: data-archive
          publish_dir: ./output
          github_token: ${{ secrets.GITHUB_TOKEN }}
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
